name: Deploy to Hetzner

# Deploys the production site to Hetzner Webhosting over FTPS (into public_html)
# on every push to `web`. The shop is intentionally excluded until launch.
on:
  push:
    branches: [ web ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HETZNER_FTP_SERVER }}
          username: ${{ secrets.HETZNER_FTP_USER }}
          password: ${{ secrets.HETZNER_FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./
          server-dir: ./public_html/
          # never upload repo/dev files to the web root
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            **/node_modules/**
            **/*.md
            # shop is still in development — keep it out of the live server
            shop/**
            CSS/shop.css
            JS/shop.js
