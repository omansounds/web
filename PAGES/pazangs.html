    <script type="x-shader/x-fragment" id="image">
        precision highp float;

        uniform vec2 iResolution;
        uniform float iTime;
        uniform float iFrame;

        #define MAX_STEPS 100
        #define MAX_DIST 30.
        #define SURF_DIST .001

        mat2 Rot(float a) {
            float s=sin(a), c=cos(a);
            return mat2(c, -s, s, c);}

        //===================================================================//
        // below by https://iquilezles.org/
        float smin( float d1, float d2, float k ) {
            float h = clamp( 0.5 + 0.5*(d2-d1)/k, 0.0, 1.0 );
            return mix( d2, d1, h ) - k*h*(1.0-h); }
        // above by https://iquilezles.org/
        //===================================================================//


        //===================================================================//
        // below by https://mercury.sexy/hg_sdf 
        float fCapsule(vec3 p, float r, float c) {
            return mix(length(p.xz) - r, length(vec3(p.x, abs(p.y) - c, p.z)) - r, step(c, abs(p.y)));
        }
        float fTorus(vec3 p, float smallRadius, float largeRadius) {
            return length(vec2(length(p.xy) - largeRadius, p.z)) - smallRadius;
        }
        // above by https://mercury.sexy/hg_sdf 
        //===================================================================//


        float OS(vec3 p) {
            const float k = - 0.5; // or some other amount
            float c = cos(k*p.y);
            float s = sin(k*p.y);
            mat2  m = mat2(c,-s,s,c);
            vec3  q = vec3(m*p.xy,p.z);

            float Capsule = fCapsule(vec3(q.x + 0.3, q.y, q.z), 0.13, 0.8);
            
            float Torus = fTorus(p, 0.18, 1.0);

            return smin(Torus, Capsule, 0.08);
        }


        vec3 CastRay(vec2 uv, vec3 p, vec3 l, float z) {
            vec3 
                f = normalize(l-p),
                r = normalize(cross(vec3(0,1,0), f)),
                u = cross(f,r),
                c = f*z,
                i = c + uv.x*r + uv.y*u;
            return normalize(i);
        }  

        #define SHADE 1

        float map(vec3 p){
            float t = iTime * 0.5;
            t += sin(iTime * 0.7) * 0.3 + 0.5;
                
            // OS
            vec3 pt = p;
            float j = 1.0-1.0*.5;
            float s = sin(t+1.0)*.2+.7;
            pt.xz *= Rot(t*.59-1.0);
            pt.xy *= Rot(t*.62+1.0);
            pt.yz *= Rot(t*.47-1.0);
            float symbol = OS(pt);
                
            return symbol;
        }

        float March(vec3 ro, vec3 rd){
            float t = 0.;
            for(int i=0; i < MAX_STEPS; i++){
                vec3 p = ro + rd * t;
                float d = map(p);
                t += d;
                if(t > MAX_DIST||abs(d) < SURF_DIST) break;
            }
            return t;
        }

        vec3 CalcNormal(vec3 p) {
            vec3 eps=vec3(.1,0,0);
            return normalize(vec3(map(p+eps.xyy) ,map(p+eps.yxy), map(p+eps.yyx)));
        }

        void main() {

            float t = iTime * 0.5;
            vec2 uv = (2. * gl_FragCoord.xy - iResolution.xy) / iResolution.y;
            vec3 ro = vec3(0,0,3);
            vec3 rd = CastRay(uv, ro, vec3(0), 2.);
            vec3 col = vec3(0);
            float d = March(ro, rd);
            vec3 p = ro + rd * d;

            vec3 n = CalcNormal(p);
            n *= n;
            n=normalize(n);
            col = vec3(n);

            vec3 lt = normalize(vec3(1.0,1.0,1.5));
            float df=clamp(dot(n,lt),0.5,1.0);
            float sp=clamp(dot(reflect(lt,n),vec3(0,0,-1)),0.0,1.0);
            sp=pow(sp,mix(64.0, 2.0, 0.0))*mix(2.5, 1.0, 0.0);
            vec3 lts = vec3(df)+sp;

            col = abs(abs(col * 2.0 - vec3(1.0)) - vec3(1.0));
            col *= lts;
            
            float edge = pow( 1.0 - dot( -rd, n), 1.1 );
            col += 0.5 * edge;
            
            col = mix( col, vec3(1), 1.-exp(-pow(.12*d,6.)));//fog    
            col = pow(col, vec3(.4545)); //gamma correction

            gl_FragColor = vec4(col,1.0);

        #if SHADE == 1
            gl_FragColor = vec4(length(col)/1.8);//thanks to https://www.shadertoy.com/user/FabriceNeyret2
        #endif
        }

    </script>

                        iResolution: (gl, loc, ctx) => gl.uniform2f(loc, ctx.width, ctx.height),
                    }
                }
            }
        });

    </script>
