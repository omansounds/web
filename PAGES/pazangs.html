    <script type="x-shader/x-fragment" id="image">
        precision mediump float;

        uniform vec2 iResolution;
        uniform float iTime;
        uniform float iFrame;

        #define MAX_STEPS 64
        #define MAX_DIST 20.
        #define SURF_DIST .01

        const int STEPS = 16;


        mat2 Rot(float a) {
            float s=sin(a), c=cos(a);
            return mat2(c, -s, s, c);
        }

        //IQ WIZARD https://iquilezles.org/
        float smin( float d1, float d2, float k ) {
            float h = clamp( 0.5 + 0.5*(d2-d1)/k, 0.0, 1.0 );
            return mix( d2, d1, h ) - k*h*(1.0-h); 
        }

        float Smax( float d1, float d2, float k ) {
            float h = clamp( 0.5 - 0.5*(d2-d1)/k, 0.0, 1.0 );
            return mix( d2, d1, h ) + k*h*(1.0-h); 
        }

        //HG_SDF https://mercury.sexy/hg_sdf 
        float fCapsule(vec3 p, float r, float c) {
            return mix(length(p.xz) - r, length(vec3(p.x, abs(p.y) - c, p.z)) - r, step(c, abs(p.y)));
        }


        float fTorus(vec3 p, float smallRadius, float largeRadius) {
            return length(vec2(length(p.xy) - largeRadius, p.z)) - smallRadius;
        }


        float OS(vec3 p) {
            const float k = - 0.5; // or some other amount
            float c = cos(k*p.y);
            float s = sin(k*p.y);
            mat2  m = mat2(c,-s,s,c);
            vec3  q = vec3(m*p.xy,p.z);

            float Capsule = fCapsule(vec3(q.x + 0.3, q.y, q.z), 0.13, 0.8);

            float Torus = fTorus(p, 0.18, 1.0);

            return smin(Torus, Capsule, 0.08);
        }

        float map(vec3 p) {

            float t = iTime * 0.5;
            t += sin(iTime * 0.7) * 0.3 + 0.5;

            // OS
            vec3 pt = p;
            float j = 1.0-1.0*.5;
            float s = sin(t+1.0)*.2+.7;
            pt.xz *= Rot(t*.59-1.0);
            pt.xy *= Rot(t*.62+1.0);
            pt.yz *= Rot(t*.47-1.0);
            float symbol = OS(pt);

            // GYROID
            vec3  pg = p;
            float sg = 1.3;
            pg.z += t;
            float gyr = abs(dot(sin(pg*sg), cos(pg.zxy*sg)))/sg-.6;

            // COMPOSITION             
            gyr = Smax(gyr,symbol-.1,.2);   
            float d = min(symbol,gyr);  

            return d;
        }


        vec3 getNormal(vec3 p) {
            vec3 eps=vec3(.1,0,0);
            return normalize(vec3(map(p+eps.xyy) ,map(p+eps.yxy), map(p+eps.yyx)));
        }

        float getVal(vec2 uv)
        {
            return length(uv);
        }
            
        vec2 gg(vec2 uv,float delta)
        {
            vec2 d=vec2(delta,0);
            return vec2(
                getVal(uv+d.xy)-getVal(uv-d.xy),
                getVal(uv+d.yx)-getVal(uv-d.yx)
            )/delta;
        }


        void main( ) {
            
            vec2 uv = (gl_FragCoord.xy * 2. - iResolution.xy) / iResolution.y;

            // Initialization
            vec3 ro = vec3(0, 0.0, -2.0);       
            vec3 rd = normalize(vec3(uv, 1));  
            vec3 col = vec3(0);             
            vec3 p = ro, pp;
            float t = 0.;  

            // Raymarching
            for (int i = 0; i < STEPS; i++) {

                float d = map(p);       // current distance to the scene

                t += d; 
                p += d * rd;                //march the ray 

                if (t < .001 || t > 500.) break;
            }
            
            vec3 normal = getNormal(p); // Surface normal
            //normal = vec3(gg(uv,1.0/iResolution.y),20.25);
            normal *= normal;
            normal = normalize(normal);
            
            col = vec3(normal);
            
            vec3 lightDir = normalize(vec3(1.0, 1.0, 1.5));
            
            float diffuse = clamp(dot(normal, lightDir), 0.5, 1.0);
            
            float spec = clamp(dot(reflect(lightDir, normal),vec3(0,0,-1)),0.0,1.0);
            spec = pow(spec, mix(150.0, 2.0, 0.0)) * mix(2.5, 1.0, 0.0);
            
            vec3 lights = vec3(diffuse) + 2.0 * spec;
            
            col = abs(abs(col * 1.0 - vec3(1.0)) - vec3(1.0));
            col = (col*(diffuse + .65) + vec3(1.0, 1.0, 1.0) * spec);
            col *= lights;
            col = pow(col, vec3(1. / 2.2));
            
            gl_FragColor = vec4(length(col)/1.8);
        }

    </script>

                        iResolution: (gl, loc, ctx) => gl.uniform2f(loc, ctx.width, ctx.height),
                    }
                }
            }
        });
